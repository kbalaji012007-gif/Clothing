<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Customer Sign In — Atelier</title>
    <link rel="stylesheet" href="/account/account.css" />
    <style>
      .auth-wrap {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--bg-secondary);
      }
      .auth-box {
        background: #fff;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-lg);
        padding: 40px;
        width: 100%;
        max-width: 420px;
        box-shadow: var(--shadow-md);
      }
      .auth-title {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 24px;
        text-align: center;
      }
      .auth-sub {
        font-size: 13px;
        color: var(--text-secondary);
        text-align: center;
        margin-bottom: 28px;
      }
      .auth-alert {
        padding: 10px 14px;
        border-radius: var(--radius-sm);
        font-size: 13px;
        margin-bottom: 16px;
        display: none;
      }
      .auth-alert.error {
        display: block;
        background: var(--danger-bg);
        color: var(--danger);
        border: 1px solid #fecaca;
      }
      .auth-footer {
        margin-top: 24px;
        text-align: center;
        font-size: 13px;
        color: var(--text-secondary);
      }
      .auth-footer a {
        font-weight: 600;
        color: var(--text-primary);
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="auth-wrap">
      <div class="auth-box">
        <div style="text-align: center; margin-bottom: 16px;">
          <a href="/" style="font-size: 14px; font-weight: 800; letter-spacing: 2px;">ATELIER LUXURY</a>
        </div>
        <h1 class="auth-title">Sign In</h1>

        <div id="alert-box" class="auth-alert"></div>

        <form id="login-form">
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" class="form-input" required placeholder="you@example.com" />
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-input" required placeholder="••••••••" />
          </div>

          <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
            Sign In →
          </button>
        </form>

        <div style="display: flex; align-items: center; margin: 20px 0; color: var(--text-secondary); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;">
          <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
          <span style="padding: 0 12px;">OR</span>
          <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
        </div>

        <button type="button" id="google-signin-btn" class="btn" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; background: #fff; border: 1px solid var(--border-color); color: #111; font-weight: 600; font-size: 13px; padding: 10px 16px; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,0.04);">
          <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          Continue with Google
        </button>

        <div class="auth-footer">
          Don't have an account? <a href="/account/register.html">Create Account</a>
          <div style="margin-top: 14px;">
            <a href="/" style="font-size: 12px; color: var(--text-secondary); text-decoration: none;">← Back to Storefront</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Firebase App & Auth SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="/account/account.js"></script>
    <script>
      (function() {
        const form = document.getElementById('login-form');
        const alertBox = document.getElementById('alert-box');
        const submitBtn = document.getElementById('submit-btn');

        // Check if already logged in
        const currentToken = AccountApp.getToken() || localStorage.getItem('atelier_admin_token');
        const currentUser = AccountApp.getUser() || (localStorage.getItem('atelier_admin_user') ? JSON.parse(localStorage.getItem('atelier_admin_user')) : null);
        if (currentToken && currentUser) {
          if (currentUser.role === 'ADMIN') {
            window.location.href = '/admin/dashboard.html';
          } else {
            window.location.href = '/account/dashboard.html';
          }
          return;
        }

        // Initialize Firebase
        const firebaseConfig = {
          apiKey: "AIzaSyBxlX53QOQD0byVDXG0ZJKNOQdeGNOscaE",
          authDomain: "clothing-agency-atelier.firebaseapp.com",
          projectId: "clothing-agency-atelier",
          storageBucket: "clothing-agency-atelier.firebasestorage.app",
          messagingSenderId: "1044697519233",
          appId: "1:1044697519233:web:8b42d886bf65056722a980"
        };
        if (typeof firebase !== 'undefined' && !firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          alertBox.className = 'auth-alert';
          alertBox.style.display = 'none';

          const email = document.getElementById('email').value.trim();
          const password = document.getElementById('password').value.trim();

          submitBtn.disabled = true;
          submitBtn.textContent = 'Verifying credentials...';

          try {
            const data = await AccountApp.apiRequest('/auth/login', {
              method: 'POST',
              body: JSON.stringify({ email, password })
            });

            AccountApp.setSession(data.token, {
              user_id: data.user_id,
              name: data.name,
              email: data.email,
              role: data.role
            });

            // Master Administrator routing
            if (data.role === 'ADMIN') {
              localStorage.setItem('atelier_admin_token', data.token);
              localStorage.setItem('atelier_admin_user', JSON.stringify({
                user_id: data.user_id,
                name: data.name,
                email: data.email,
                role: data.role
              }));

              alertBox.textContent = `Welcome Master Administrator, ${data.name}! Opening Admin HQ...`;
              alertBox.className = 'auth-alert';
              alertBox.style.display = 'block';
              alertBox.style.background = '#dcfce7';
              alertBox.style.color = '#166534';
              alertBox.style.border = '1px solid #bbf7d0';

              setTimeout(() => {
                window.location.href = '/admin/dashboard.html';
              }, 400);
              return;
            }

            // Customer routing
            if (sessionStorage.getItem('pending_checkout') === 'true') {
              sessionStorage.removeItem('pending_checkout');
              window.location.href = '/?checkout=true';
            } else {
              window.location.href = '/account/dashboard.html';
            }
          } catch (err) {
            alertBox.textContent = err.message || 'Login failed. Please verify your credentials.';
            alertBox.className = 'auth-alert error';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Sign In →';
          }
        });

        // Google Authentication via Firebase Popup
        const googleBtn = document.getElementById('google-signin-btn');
        if (googleBtn) {
          googleBtn.addEventListener('click', async () => {
            alertBox.className = 'auth-alert';
            alertBox.style.display = 'none';

            googleBtn.disabled = true;
            googleBtn.innerHTML = '<span>Connecting to Google...</span>';

            try {
              if (typeof firebase === 'undefined' || !firebase.auth) {
                throw new Error('Firebase authentication library could not be loaded.');
              }

              const provider = new firebase.auth.GoogleAuthProvider();
              provider.setCustomParameters({ prompt: 'select_account' });
              const result = await firebase.auth().signInWithPopup(provider);
              const user = result.user;
              const idToken = await user.getIdToken();

              googleBtn.innerHTML = '<span>Authenticating session...</span>';

              const data = await AccountApp.apiRequest('/auth/google', {
                method: 'POST',
                body: JSON.stringify({
                  email: user.email,
                  name: user.displayName || user.email.split('@')[0],
                  credential: idToken
                })
              });

              AccountApp.setSession(data.token, {
                user_id: data.user_id,
                name: data.name,
                email: data.email,
                role: data.role
              });

              if (data.role === 'ADMIN') {
                localStorage.setItem('atelier_admin_token', data.token);
                localStorage.setItem('atelier_admin_user', JSON.stringify({
                  user_id: data.user_id,
                  name: data.name,
                  email: data.email,
                  role: data.role
                }));

                alertBox.textContent = `Welcome Master Administrator, ${data.name}! Opening Admin HQ...`;
                alertBox.className = 'auth-alert';
                alertBox.style.display = 'block';
                alertBox.style.background = '#dcfce7';
                alertBox.style.color = '#166534';
                alertBox.style.border = '1px solid #bbf7d0';

                setTimeout(() => {
                  window.location.href = '/admin/dashboard.html';
                }, 400);
                return;
              }

              alertBox.textContent = `Welcome, ${data.name}! Signed in successfully.`;
              alertBox.className = 'auth-alert';
              alertBox.style.display = 'block';
              alertBox.style.background = '#dcfce7';
              alertBox.style.color = '#166534';
              alertBox.style.border = '1px solid #bbf7d0';

              setTimeout(() => {
                if (sessionStorage.getItem('pending_checkout') === 'true') {
                  sessionStorage.removeItem('pending_checkout');
                  window.location.href = '/?checkout=true';
                } else {
                  window.location.href = '/account/dashboard.html';
                }
              }, 600);
            } catch (err) {
              if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') {
                alertBox.style.display = 'none';
              } else if (err.code === 'auth/unauthorized-domain') {
                alertBox.textContent = 'Domain not authorized in Firebase Console yet. Please ensure clothing-two-lime.vercel.app is added under Authorized Domains.';
                alertBox.className = 'auth-alert error';
                alertBox.style.display = 'block';
              } else {
                alertBox.textContent = err.message || 'Google sign-in failed. Please try again.';
                alertBox.className = 'auth-alert error';
                alertBox.style.display = 'block';
              }
              googleBtn.disabled = false;
              googleBtn.innerHTML = `
                <svg width="18" height="18" viewBox="0 0 24 24">
                  <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                  <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                  <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                  <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                </svg>
                Continue with Google
              `;
            }
          });
        }
      })();
    </script>
  </body>
</html>
