<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Administrator Sign In — Atelier Management</title>
    <link rel="stylesheet" href="/admin/admin.css" />
    <style>
      .login-container {
        min-height: 100vh;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 20%, #1a1a24 0%, #0b0b0e 70%);
        padding: 24px;
      }
      .login-card {
        background: #141418;
        border: 1px solid var(--admin-border);
        border-radius: var(--admin-radius-lg);
        padding: 44px 38px;
        width: 100%;
        max-width: 420px;
        box-shadow: 0 16px 48px rgba(0,0,0,0.5);
      }
      .brand-crest {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: var(--admin-accent-gold);
        color: #000;
        font-weight: 900;
        font-size: 18px;
        margin-bottom: 20px;
      }
      .login-title {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .login-sub {
        font-size: 13px;
        color: var(--admin-text-muted);
        margin-bottom: 26px;
      }
      .login-alert {
        padding: 12px 14px;
        border-radius: var(--admin-radius-sm);
        font-size: 13px;
        margin-bottom: 20px;
        display: none;
      }
      .login-alert.error {
        display: block;
        background: var(--admin-danger-bg);
        color: var(--admin-danger);
        border: 1px solid rgba(239, 68, 68, 0.3);
      }
      .login-alert.info {
        display: block;
        background: var(--admin-info-bg);
        color: var(--admin-info);
        border: 1px solid rgba(59, 130, 246, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-card">
        <div style="text-align: center;">
          <div class="brand-crest">✦</div>
          <h1 class="login-title">Atelier Console</h1>
          <p class="login-sub">Administrative access for executive fashion operations and fulfillment.</p>
        </div>

        <div id="alert-box" class="login-alert"></div>

        <form id="admin-login-form">
          <div style="margin-bottom: 18px;">
            <label style="display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--admin-text-muted); margin-bottom: 6px;" for="admin-email">Administrator Email</label>
            <input type="email" id="admin-email" class="filter-input" style="width: 100%; padding: 12px 14px;" required placeholder="kbalaji@gmail.com" />
          </div>

          <div style="margin-bottom: 24px;">
            <label style="display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--admin-text-muted); margin-bottom: 6px;" for="admin-password">Secure Password</label>
            <input type="password" id="admin-password" class="filter-input" style="width: 100%; padding: 12px 14px;" required placeholder="••••••••••••" />
          </div>

          <button type="submit" id="submit-btn" class="admin-btn admin-btn-gold" style="width: 100%; padding: 12px; justify-content: center; font-size: 14px;">
            Authenticate Console →
          </button>
        </form>

        <div style="margin-top: 24px; text-align: center; border-top: 1px solid var(--admin-border-subtle); padding-top: 18px;">
          <a href="/" style="font-size: 12px; color: var(--admin-text-muted); text-decoration: none;">← Return to Customer Storefront</a>
        </div>
      </div>
    </div>

    <script src="/admin/admin.js"></script>
    <script>
      (function() {
        const form = document.getElementById('admin-login-form');
        const alertBox = document.getElementById('alert-box');
        const submitBtn = document.getElementById('submit-btn');

        // Check if admin is already logged in
        const token = AdminApp.getToken();
        const user = AdminApp.getUser();
        if (token && user && user.role === 'ADMIN') {
          window.location.href = '/admin/dashboard.html';
          return;
        }

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          alertBox.className = 'login-alert';
          alertBox.style.display = 'none';

          const email = document.getElementById('admin-email').value.trim();
          const password = document.getElementById('admin-password').value.trim();

          submitBtn.disabled = true;
          submitBtn.textContent = 'Verifying security claims...';

          try {
            const data = await AdminApp.apiRequest('/auth/admin-login', {
              method: 'POST',
              body: JSON.stringify({ email, password })
            });

            AdminApp.setSession(data.token, {
              user_id: data.user_id,
              name: data.name,
              email: data.email,
              role: data.role
            });

            window.location.href = '/admin/dashboard.html';
          } catch (err) {
            alertBox.textContent = err.message || 'Authentication failed. Administrator privileges required.';
            alertBox.className = 'login-alert error';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Authenticate Console →';
          }
        });
      })();
    </script>
  </body>
</html>
