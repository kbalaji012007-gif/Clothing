services:
  - type: web
    name: clothing-agency-api
    runtime: python
    region: singapore   # closest to India; change to "ohio" or "frankfurt" if needed
    plan: free          # upgrade to "starter" for always-on

    # Render sets the working directory to the repo root automatically.
    # We install from backend/requirements.txt and start from repo root
    # so that `database/` is importable as a sibling package.
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT

    # Environment variables — set SECRET values in the Render dashboard,
    # not here. Only non-secret defaults belong in this file.
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: HOST
        value: "0.0.0.0"
      - key: CORS_ORIGINS
        value: "*"
      # Set these in Render Dashboard → Environment (never commit real values):
      # - key: FIREBASE_SERVICE_ACCOUNT_JSON   (paste the full JSON as one line)
      # - key: FIREBASE_PROJECT_ID
