services:
  - type: web
    name: clothing-agency-backend
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@atelier.luxury
      - key: ADMIN_INITIAL_PASSWORD
        value: Admin@Atelier2026
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
